description: >-
  EasyPost offers a freemium model: free for up to 3,000 labels per month using EasyPost Wallet
  carriers; $20/month plus per-label fees when using bring-your-own-carrier accounts; enterprise
  pricing for high-volume shippers. Tracking is $0.01-$0.03 per shipment (Standard) or $0.03
  (Advanced). Insurance is 1% of declared value with a $1 minimum. EasyPost Forge (logistics platform)
  and GlobalShip require sales contact.
notes: "Freemium: 3,000 free labels/month on Wallet carriers; metered pricing thereafter."
sources:
- https://www.easypost.com/pricing
- https://docs.easypost.com/
