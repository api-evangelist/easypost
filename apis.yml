aid: easypost
url: https://raw.githubusercontent.com/api-evangelist/easypost/refs/heads/main/apis.yml
name: EasyPost
kind: company
description: >-
  EasyPost is a multi-carrier shipping API platform for the United States and international markets.
  It exposes a REST API spanning shipments, rating, labels, tracking, addresses, parcels, insurance,
  claims, pickups, scan forms, refunds, batches, end-shippers, reports, customs info, carrier
  accounts, and webhooks. EasyPost integrates 100+ carriers including USPS, UPS, FedEx, DHL, Canada
  Post, and Royal Mail.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/easypost.png
tags:
  - Shipping
  - Logistics
  - Multi-Carrier
  - Tracking
  - Labels
  - Insurance
created: '2026-05-08'
modified: '2026-05-30'
specificationVersion: '0.19'
apis:
- aid: easypost:shipping
  name: EasyPost Shipping API
  description: >-
    Core REST API. Resources: Shipments (immutable; ship + buy rate), Rates, Addresses, Parcels, CustomsInfo,
    Forms, Labels (PNG/PDF/ZPL/EPL2), Pickups, ScanForms, Refunds, Batches, EndShippers, CarrierAccounts.
    Authentication uses your API key as HTTP Basic auth username (EASYPOST_API_KEY). Test and Production
    keys are issued separately.
  humanURL: https://docs.easypost.com/docs/shipments
  baseURL: https://api.easypost.com/v2
  tags:
  - Shipments
  - Rates
  - Labels
  - Addresses
  - Pickups
  - Refunds
  properties:
  - type: Documentation
    url: https://docs.easypost.com/
  - type: Authentication
    url: https://docs.easypost.com/docs/authentication
- aid: easypost:tracking
  name: EasyPost Tracking API
  description: >-
    Standalone Tracking API: create Trackers from a tracking code + carrier, receive webhooks on status
    changes, query historical scan events. Standard Tracking and Advanced Tracking tiers are available
    with different per-shipment pricing.
  humanURL: https://docs.easypost.com/docs/trackers
  baseURL: https://api.easypost.com/v2
  tags:
  - Tracking
  - Webhooks
  properties:
  - type: Documentation
    url: https://docs.easypost.com/docs/trackers
- aid: easypost:webhooks
  name: EasyPost Webhooks API
  description: >-
    Asynchronous Event delivery surface. EasyPost POSTs Event objects to subscriber URLs whenever asynchronous
    objects (batches, trackers, scan forms, refunds, reports, payments, claims, insurance, shipment invoices)
    change state. Each delivery is signed with an HMAC-SHA256 signature in the X-Hmac-Signature header,
    derived from a per-webhook secret. Subscribers must return a 2XX status code; non-2XX responses are
    retried.
  humanURL: https://docs.easypost.com/docs/webhooks
  baseURL: https://api.easypost.com/v2
  tags:
  - Webhooks
  - Events
  - AsyncAPI
  - HMAC
  properties:
  - type: Documentation
    url: https://docs.easypost.com/docs/webhooks
  - type: Events
    url: https://docs.easypost.com/docs/events
  - type: Payloads
    url: https://docs.easypost.com/docs/events/payloads
  - type: AsyncAPI
    url: asyncapi/easypost-webhooks-asyncapi.yml
- aid: easypost:insurance-claims
  name: EasyPost Insurance & Claims API
  description: >-
    Insurance API: insure shipments at 1% of declared value with a $1 minimum. Claims API: file and manage
    damage/loss/theft claims via REST.
  humanURL: https://docs.easypost.com/docs/insurance
  baseURL: https://api.easypost.com/v2
  tags:
  - Insurance
