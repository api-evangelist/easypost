- Logistics
- Multi-Carrier
- Tracking
- Labels
- Insurance
- FinOps
- Cost Management
- FOCUS
description: >-
  FOCUS-aligned FinOps profile for EasyPost. Cost lines are: (1) platform/subscription fee for BYOA,
  (2) per-label charges for non-Wallet carriers, (3) carrier postage cost for purchased rates (passed
  through), (4) Tracking per-shipment, (5) Insurance 1% of value (min $1), and (6) any
  Forge/GlobalShip subscription. Optimize by using EasyPost Wallet for low-volume / SMB workflows up
  to 3,000 labels/month, batching label buys, and reducing tracker creation for already-delivered
  shipments.
notes: Multiple metered lines; postage is pass-through. Wallet free tier covers many SMB use cases.
sources:
- https://www.easypost.com/pricing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: EasyPost
serviceCategory: Shipping API
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Subscription
  - Usage
  - Purchase
focusColumns:
  ServiceName: EasyPost
  ServiceCategory: Shipping
  ProviderName: EasyPost
  PublisherName: EasyPost
  InvoiceIssuerName: EasyPost
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
- name: labels_purchased
  description: Shipping labels purchased (Wallet vs. BYOA).
  unit: label
  aggregation: sum
  dimensions:
  - carrier
  - service
  - wallet_or_byoa
- name: tracking_events
  description: Tracker creations / scan events billed.
  unit: shipment
  aggregation: sum
  dimensions:
  - tier
- name: insurance_charges
  description: Insurance fees (1% of value, $1 min).
  unit: USD
  aggregation: sum
  dimensions:
  - service
- name: postage_passthrough
  description: Carrier postage cost passed through to the shipper.
  unit: USD
  aggregation: sum
  dimensions:
  - carrier
  - service
principles:
- name: Visibility
  description: Pull EasyPost Reports API monthly; reconcile labels, tracking, insurance, and postage by carrier.
- name: Allocation
  description: Tag shipments with order/customer ID for chargeback to the originating brand.
- name: Optimization
  description: Use Wallet carriers under 3,000 labels/month; batch high-volume label creation; avoid duplicate Tracker creations.
- name: Accountability
  description: Logistics/ops team owns EasyPost contract; engineering owns API-key hygiene.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
